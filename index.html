<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorveteria Doce Verão</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Decoração Y2K Floral 2000 nos cantos -->
  <svg class="y2k-floral y2k-topo-dir" viewBox="0 0 400 400" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="rosaMetalico" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="35%" stop-color="#f472b6"/>
        <stop offset="70%" stop-color="#9d174d"/>
        <stop offset="100%" stop-color="#3b0722"/>
      </linearGradient>
    </defs>
    <path d="M400 0 C320 10, 260 60, 290 130 C315 185, 385 165, 365 115 C350 80, 305 95, 315 125" stroke="url(#rosaMetalico)" stroke-width="5" stroke-linecap="round"/>
    <path d="M390 20 C270 35, 190 110, 225 215 C255 300, 355 275, 330 205 C310 155, 250 175, 265 215" stroke="url(#rosaMetalico)" stroke-width="6" stroke-linecap="round"/>
    <path d="M340 0 C220 5, 110 70, 130 165 C145 235, 225 220, 205 165 C190 125, 145 140, 155 170" stroke="url(#rosaMetalico)" stroke-width="4" stroke-linecap="round"/>
    <path d="M260 15 C195 45, 175 110, 215 145 C180 125, 155 75, 210 25 Z" fill="url(#rosaMetalico)" opacity="0.7"/>
    <path d="M375 95 C335 145, 345 225, 395 255 C355 235, 310 185, 355 105 Z" fill="url(#rosaMetalico)" opacity="0.75"/>
    <circle cx="150" cy="45" r="3" fill="#fbcfe8"/><circle cx="170" cy="36" r="2.5" fill="#fbcfe8"/><circle cx="192" cy="30" r="2" fill="#fbcfe8"/>
    <circle cx="245" cy="255" r="3.5" fill="#fbcfe8"/><circle cx="268" cy="268" r="3" fill="#fbcfe8"/><circle cx="292" cy="274" r="2.5" fill="#fbcfe8"/>
  </svg>

  <svg class="y2k-floral y2k-baixo-esq" viewBox="0 0 400 400" fill="none" aria-hidden="true">
    <path d="M400 0 C320 10, 260 60, 290 130 C315 185, 385 165, 365 115 C350 80, 305 95, 315 125" stroke="url(#rosaMetalico)" stroke-width="5" stroke-linecap="round"/>
    <path d="M390 20 C270 35, 190 110, 225 215 C255 300, 355 275, 330 205 C310 155, 250 175, 265 215" stroke="url(#rosaMetalico)" stroke-width="6" stroke-linecap="round"/>
    <path d="M340 0 C220 5, 110 70, 130 165 C145 235, 225 220, 205 165 C190 125, 145 140, 155 170" stroke="url(#rosaMetalico)" stroke-width="4" stroke-linecap="round"/>
    <path d="M260 15 C195 45, 175 110, 215 145 C180 125, 155 75, 210 25 Z" fill="url(#rosaMetalico)" opacity="0.7"/>
    <path d="M375 95 C335 145, 345 225, 395 255 C355 235, 310 185, 355 105 Z" fill="url(#rosaMetalico)" opacity="0.75"/>
    <circle cx="150" cy="45" r="3" fill="#fbcfe8"/><circle cx="170" cy="36" r="2.5" fill="#fbcfe8"/><circle cx="192" cy="30" r="2" fill="#fbcfe8"/>
    <circle cx="245" cy="255" r="3.5" fill="#fbcfe8"/><circle cx="268" cy="268" r="3" fill="#fbcfe8"/><circle cx="292" cy="274" r="2.5" fill="#fbcfe8"/>
  </svg>

  <div class="container">
    <main class="grade-principal">
      
      <!-- COLUNA ESQUERDA: Formulário -->
      <section class="cartao">
        <header>
          <div class="icone">🍦✨</div>
          <h1>Sorveteria <span>Doce Verão</span></h1>
          <p>Preencha os dados principais do pedido.</p>
        </header>

        <form id="pedido">
          <input type="hidden" id="edit-id">

          <label for="sabor">Sabor do sorvete</label>
          <select id="sabor" required>
            <option value="" data-preco="0">Selecione o sabor</option>
            <option value="Chocolate" data-preco="15.00">Chocolate</option>
            <option value="Morango" data-preco="15.00">Morango</option>
            <option value="Baunilha" data-preco="12.00">Baunilha</option>
            <option value="Cookies" data-preco="17.00">Cookies</option>
            <option value="Chocomenta" data-preco="16.00">Chocomenta</option>
            <option value="Pistache" data-preco="19.00">Pistache</option>
            <option value="Ninho com Nutella" data-preco="18.00">Ninho com Nutella</option>
            <option value="Flocos" data-preco="14.00">Flocos</option>
            <option value="Doce de Leite" data-preco="15.00">Doce de Leite</option>
            <option value="Açaí com Morango" data-preco="16.00">Açaí com Morango</option>
          </select>

          <label>Adicionais</label>
          <div class="adicionais-lista" id="adicionais">
            <label class="adicional-item">
              <input type="checkbox" value="Granulado" data-preco="2.00"> Granulado (+R$ 2,00)
            </label>
            <label class="adicional-item">
              <input type="checkbox" value="Calda de Chocolate" data-preco="2.50"> Calda Choc. (+R$ 2,50)
            </label>
            <label class="adicional-item">
              <input type="checkbox" value="Chantilly" data-preco="3.00"> Chantilly (+R$ 3,00)
            </label>
            <label class="adicional-item">
              <input type="checkbox" value="Leite Condensado" data-preco="2.50"> Leite Cond. (+R$ 2,50)
            </label>
            <label class="adicional-item">
              <input type="checkbox" value="Confete" data-preco="3.00"> Confete (+R$ 3,00)
            </label>
            <label class="adicional-item">
              <input type="checkbox" value="Paçoca" data-preco="2.00"> Paçoca (+R$ 2,00)
            </label>
          </div>

          <label for="preco">Preço do produto</label>
          <input id="preco" type="text" inputmode="numeric" placeholder="R$ 0,00" value="R$ 0,00" required>

          <label for="endereco">Endereço do cliente</label>
          <input id="endereco" type="text" placeholder="Ex.: Rua das Flores, 120 - Centro" required>

          <label for="pagamento">Forma de pagamento</label>
          <select id="pagamento" required>
            <option value="">Selecione o pagamento</option>
            <option value="Pix">Pix</option>
            <option value="Cartão">Cartão</option>
            <option value="Dinheiro">Dinheiro</option>
          </select>

          <label for="situacao">Situação</label>
          <select id="situacao" required>
            <option value="Em preparo">Em preparo</option>
            <option value="Entregue">Entregue</option>
          </select>

          <button type="submit" id="btn-submit">🛒 Fazer pedido</button>
          <button type="button" id="btn-cancelar" class="btn-cancelar" style="display: none;">Cancelar edição</button>
          <p id="mensagem" role="status"></p>
        </form>
      </section>

      <!-- COLUNA DIREITA: Listagem e Pesquisa -->
      <section class="cartao">
        <div class="cabecalho-lista">
          <h2>Pedidos cadastrados ✧</h2>
          <span id="contador-pedidos" class="subtitulo-lista">3 pedidos</span>
        </div>

        <label for="pesquisa">Pesquisar no catálogo</label>
        <input id="pesquisa" type="text" placeholder="Digite sabor, adicional, endereço ou pagamento...">
        <small class="dica-busca">A busca também considera a situação do pedido.</small>

        <div class="tabela-wrapper">
          <table>
            <thead>
              <tr>
                <th>PEDIDO</th>
                <th>PAGAMENTO</th>
                <th>SITUAÇÃO</th>
                <th>AÇÕES</th>
              </tr>
            </thead>
            <tbody id="lista-pedidos">
              <!-- Preenchido via JavaScript -->
            </tbody>
          </table>
        </div>
      </section>

    </main>

    <footer class="rodape-exemplo">
      ✧ Exemplo de uma tabela simples: pedidos • identificador, sabor, adicionais, endereço, pagamento e situação ✧
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
